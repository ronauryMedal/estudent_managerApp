<ion-tabs (ionTabsDidChange)="onTabChange($event)">
  <ion-tab-bar slot="bottom" class="app-tab-bar">
    <div
      class="app-tab-bar__indicator"
      [style.transform]="indicatorOffset()"
      aria-hidden="true"
    ></div>

    <ion-tab-button tab="tab1" href="/tabs/tab1" class="app-tab-btn">
      <ion-icon aria-hidden="true" [name]="tabIcon('tab1')"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2" class="app-tab-btn">
      <ion-icon aria-hidden="true" [name]="tabIcon('tab2')"></ion-icon>
      <ion-label>Tareas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3" class="app-tab-btn">
      <ion-icon aria-hidden="true" [name]="tabIcon('tab3')"></ion-icon>
      <ion-label>Materias</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
