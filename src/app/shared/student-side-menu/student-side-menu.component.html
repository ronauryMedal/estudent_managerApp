<ion-menu
  class="student-menu"
  menuId="student-menu"
  contentId="main-content"
  side="start"
  type="overlay"
  [disabled]="!auth.isAuthenticated()"
  [swipeGesture]="auth.isAuthenticated()"
>
  <ion-content class="student-menu__content" [scrollY]="false">
    <div class="student-menu__inner">
      @if (auth.currentUser(); as user) {
        <button
          type="button"
          class="student-menu__profile"
          (click)="go('/profile')"
        >
          <div class="student-menu__profile-glow" aria-hidden="true"></div>
          <div class="student-menu__avatar-wrap">
            <ion-avatar class="student-menu__avatar" aria-hidden="true">
              @if (user.avatarUrl) {
                <img [src]="user.avatarUrl" [alt]="'Avatar de ' + user.name" />
              } @else {
                <span class="student-menu__initials">{{ initials() }}</span>
              }
            </ion-avatar>
          </div>
          <div class="student-menu__profile-meta">
            <h2 class="student-menu__name">{{ user.name }}</h2>
            <p class="student-menu__email">{{ user.email }}</p>
            @if (user.role) {
              <span class="student-menu__role">
                {{ user.role === 'STUDENT' ? 'Estudiante' : user.role }}
              </span>
            }
            <span class="student-menu__profile-cta">
              Ver mi perfil
              <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
            </span>
          </div>
        </button>
      } @else {
        <div class="student-menu__profile student-menu__profile--empty">
          <ion-icon
            name="person-circle-outline"
            class="student-menu__placeholder-icon"
            aria-hidden="true"
          ></ion-icon>
          <p class="student-menu__email">Sesión no disponible</p>
        </div>
      }

      <nav class="student-menu__nav" aria-label="Navegación principal">
        <button
          type="button"
          class="student-menu__link"
          [class.student-menu__link--active]="isProfileRoute()"
          (click)="go('/profile')"
        >
          <span class="student-menu__link-icon" aria-hidden="true">
            <ion-icon name="person-circle-outline"></ion-icon>
          </span>
          <span class="student-menu__link-label">Mi perfil</span>
        </button>

        <button
          type="button"
          class="student-menu__link"
          [class.student-menu__link--active]="isHomeRoute()"
          (click)="go('/tabs/tab1')"
        >
          <span class="student-menu__link-icon" aria-hidden="true">
            <ion-icon name="home-outline"></ion-icon>
          </span>
          <span class="student-menu__link-label">Inicio</span>
        </button>

        <button
          type="button"
          class="student-menu__link"
          [class.student-menu__link--active]="isTasksRoute()"
          (click)="go('/tabs/tab2')"
        >
          <span class="student-menu__link-icon" aria-hidden="true">
            <ion-icon name="clipboard-outline"></ion-icon>
          </span>
          <span class="student-menu__link-label">Tareas</span>
        </button>

        <button
          type="button"
          class="student-menu__link"
          [class.student-menu__link--active]="isSubjectsRoute()"
          (click)="go('/tabs/tab3')"
        >
          <span class="student-menu__link-icon" aria-hidden="true">
            <ion-icon name="library-outline"></ion-icon>
          </span>
          <span class="student-menu__link-label">Materias</span>
        </button>

        <button
          type="button"
          class="student-menu__link student-menu__link--stacked"
          [class.student-menu__link--active]="isTeachersRoute()"
          (click)="go('/teachers')"
        >
          <span class="student-menu__link-icon" aria-hidden="true">
            <ion-icon name="people-outline"></ion-icon>
          </span>
          <span class="student-menu__link-text">
            <span class="student-menu__link-label">Profesores</span>
            <span class="student-menu__link-hint">Crear y listar para tus materias</span>
          </span>
        </button>
      </nav>

      <footer class="student-menu__footer">
        <button type="button" class="student-menu__logout" (click)="logout()">
          <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
          Cerrar sesión
        </button>
      </footer>
    </div>
  </ion-content>
</ion-menu>
